<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1320"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><title>Экзамен מבוא למחשב</title><style>:root{--bg:#0e1320;--card:#182035;--card2:#212b45;--tx:#eef2ff;--mut:#9aa6c8;--ac:#4cc9f0;--ok:#3ddc84;--bad:#ff5c7a;--red:#ff6b6b;--gold:#ffd166;--mono:ui-monospace,"Roboto Mono","Droid Sans Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.back{color:var(--tx);text-decoration:none;font-size:24px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--card);border:0;cursor:pointer;flex:none}
.ttl{font-weight:700;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:0 14px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.body{flex:1;padding:14px 16px 8px}
.foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%)}
h2{font-size:21px;margin:4px 0 10px}
p{margin:6px 0}
.mut{color:var(--mut);font-size:15px}
.he{direction:rtl;text-align:right;color:var(--gold);font-size:15px;margin-top:8px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:10px 0}
.rule{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff10;font-size:17px}
.rule:last-child{border:0}
.rule .m{font-family:var(--mono);font-size:19px;min-width:118px;font-weight:700}
.m{font-family:var(--mono)}
b.r{color:var(--red)} b.g{color:var(--ok)} b.a{color:var(--ac)} b.y{color:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:700 18px system-ui,sans-serif;background:var(--ac);color:#06202b;cursor:pointer;margin:8px 0}
.btn.sec{background:var(--card2);color:var(--tx)}
.btn:active{transform:scale(.98)}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:18px;background:var(--card);color:var(--tx);margin:10px 0;cursor:pointer;font:inherit}
.big .e{font-size:34px;width:46px;text-align:center}
.big b{display:block;font-size:19px}
.big span{color:var(--mut);font-size:14px}
.big.hl{background:linear-gradient(135deg,#1f3b5a,#182035);outline:2px solid var(--ac)}
/* tiles */
.pad{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.tile{min-width:58px;height:58px;padding:0 10px;border-radius:14px;background:#f4f6ff;color:#101828;font:800 26px var(--mono);display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;box-shadow:0 4px 0 #9aa6c8;border:0}
.tile.sm{min-width:48px;height:52px;font-size:22px}
.tile.op{background:var(--card2);color:var(--tx);box-shadow:0 4px 0 #0a0f1a;font-size:20px}
.tile.go{background:var(--ok);color:#06240f;box-shadow:0 4px 0 #1f8a50}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #9aa6c8}
.ghost{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%) scale(1.15);opacity:.92}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:46px;height:54px;border-radius:12px;border:2px dashed #5b6a93;display:grid;place-items:center;font:800 26px var(--mono);color:var(--tx)}
.slot.f{border-style:solid;border-color:var(--ac);background:#4cc9f022}
.slot.act{border-color:var(--gold);background:#ffd16622;animation:pulse 1.2s infinite}
.slot.ok{border-color:var(--ok);background:#3ddc8433}
.slot.bad{border-color:var(--bad);background:#ff5c7a33}
@keyframes pulse{50%{box-shadow:0 0 0 5px #ffd16633}}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.say{min-height:52px;padding:10px 14px;border-radius:14px;background:var(--card2);margin:10px 0;font-size:16px}
.say.ok{background:#173a2a}
.say.bad{background:#41202a}
/* column grid */
.grid{display:grid;justify-content:center;gap:0;margin:8px auto;font-family:var(--mono)}
.c{display:grid;place-items:center;font-weight:800;position:relative}
.c.carry{color:var(--red);font-size:.62em;line-height:1;height:.95em;align-self:end}
.c.line{border-top:3px solid var(--tx);height:0}
.c.cur{background:#ffd16620}
.c.res{border-radius:8px}
.c.res.act{outline:2px dashed var(--gold);outline-offset:-3px}
.c.drop{color:var(--mut);text-decoration:line-through}
.c.sign{color:var(--ac)}
.c.dim{color:#5b6a93}
.c.bhl{color:var(--gold)}
.opts{display:grid;gap:8px}
.opt{border:0;border-radius:14px;padding:14px;background:var(--card2);color:var(--tx);font:600 17px system-ui,sans-serif;text-align:left;cursor:pointer}
.opt.ok{background:#1e6b45}
.opt.bad{background:#7a2a3a}
.disp{font:800 30px var(--mono);text-align:center;min-height:52px;padding:6px;border-radius:14px;background:var(--card2);margin:10px 0;letter-spacing:2px;word-break:break-all}
.disp.ok{background:#1e6b45}.disp.bad{background:#7a2a3a}
.bits{display:flex;gap:5px;justify-content:center;margin:12px 0}
.bit{width:38px;height:54px;border-radius:10px;background:#f4f6ff;color:#101828;font:800 26px var(--mono);display:grid;place-items:center;border:0;cursor:pointer;box-shadow:0 4px 0 #9aa6c8;padding:0}
.bit.done{background:var(--ok);box-shadow:0 4px 0 #1f8a50}
.lamps{display:flex;gap:4px;justify-content:center;margin:10px 0}
.lamp{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border:0;background:none;color:var(--tx);padding:0}
.lamp i{font-style:normal;font-size:12px;color:var(--mut);font-family:var(--mono)}
.lamp b{width:38px;height:46px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font:800 24px var(--mono);color:#5b6a93}
.lamp.on b{background:var(--gold);color:#3a2a00;box-shadow:0 0 14px #ffd16688}
.sum{text-align:center;font:700 20px var(--mono);margin:6px 0}
.grp{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.grp .g{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:12px;background:var(--card2)}
.grp .g.act{outline:2px solid var(--gold)}
.grp .g .bb{font:800 24px var(--mono);letter-spacing:2px}
.grp .g .w{font:12px var(--mono);color:var(--mut);letter-spacing:9px;padding-left:9px}
.grp .g .slot{width:44px;height:48px}
/* arcade */
.arc{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;max-width:560px;margin:0 auto}
.hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0e1320;color:#fff;font-weight:700}
.hud .sp{flex:1}
.stage{flex:1;position:relative;min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.qbox{position:absolute;left:10px;right:10px;top:10px;text-align:center;font:800 22px var(--mono);color:#fff;background:#000a;padding:8px;border-radius:12px;white-space:pre-wrap;pointer-events:none}
.aopts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 10px calc(12px + env(safe-area-inset-bottom));background:#0e1320}
.aopts button{min-height:64px;border:0;border-radius:14px;background:#f4f6ff;color:#101828;font:800 18px var(--mono);cursor:pointer;padding:6px;word-break:break-word;box-shadow:0 4px 0 #9aa6c8}
.aopts button.long{font:700 14px system-ui,sans-serif}
.aopts button:active{transform:translateY(3px)}
.over{position:absolute;inset:0;background:#000c;display:flex;flex-direction:column;justify-content:center;padding:20px;color:#fff;z-index:3}
.over .card{background:#182035}
.home h1{font-size:24px;margin:6px 0}
.ok-ic{color:var(--ok)}
</style></head>
<body><div id="app"><div class="body home">
<h1>📝 Экзамен <bdi>מבוא למחשב</bdi></h1>
<div class="card">Четверг 12.11 · 1 час · 3 задания:<div class="rule">1. Таблица: 10 · 2 · 8 · 16</div><div class="rule">2. Перевести в двоичную и сложить</div><div class="rule">3. Сложить отрицательные (дополнение до 2)</div><p class="mut">Везде показать путь и проверить ответ.</p></div>
<div id="list"></div>
<button class="btn sec" id="inst" style="display:none">📲 Установить как приложение</button>
<p class="mut" id="off">⏳ Сохраняю на телефон…</p>
</div></div>
<script>
var G=[{"id": "add", "file": "1-add", "emoji": "➕", "title": "Сложение в двоичной", "sub": "урок 05.11 · переносы «1 наверх»"}, {"id": "mul", "file": "2-mul", "emoji": "✖️", "title": "Умножение: «эти единички»", "sub": "урок 05.11 · те самые «1.1.1.1»"}, {"id": "neg", "file": "3-neg", "emoji": "🧲", "title": "Отрицательные числа", "sub": "урок 05.11 · задание 3 экзамена: −4 + −15"}, {"id": "b10", "file": "4-bin", "emoji": "🔢", "title": "Перевод 10 ↔ 2", "sub": "уроки 22.10 и 05.11 · вес разряда"}, {"id": "hex", "file": "5-hex", "emoji": "🔤", "title": "8-ичная и 16-ричная", "sub": "уроки 29.10 и 05.11 · группы по 3 и по 4"}, {"id": "exam", "file": "6-exam", "emoji": "📝", "title": "Вариант экзамена", "sub": "новый вариант каждый раз · как завтра"}];
var L=document.getElementById('list');
G.forEach(function(g,i){
  var fin=0,best=0; try{fin=+JSON.parse(localStorage.getItem('ex_'+g.id+'_fin')||'0');best=+JSON.parse(localStorage.getItem('ex_'+g.id+'_best')||'0');}catch(e){}
  var a=document.createElement('a'); a.className='big'+(i===0&&!fin?' hl':''); a.href=g.file+'.html'; a.style.textDecoration='none';
  a.innerHTML='<div class="e">'+g.emoji+'</div><div><b>'+(i+1)+'. '+g.title+'</b><span>'+g.sub+(fin?' · ✅ пройдено':'')+(best?' · рекорд '+best:'')+'</span></div>';
  L.appendChild(a);
});
var off=document.getElementById('off');
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;}).then(function(){off.textContent='✅ Сохранено на телефоне: работает без интернета';}).catch(function(){off.textContent='';});}else off.textContent='';
var dp=null,ib=document.getElementById('inst');
addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;ib.style.display='';});
ib.onclick=function(){if(dp){dp.prompt();dp=null;ib.style.display='none';}};
</script></body></html>
