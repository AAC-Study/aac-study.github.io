.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.body{flex:1;padding:14px 16px 8px}
.foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%)}
h2{font-size:21px;margin:4px 0 10px}
p{margin:6px 0}
.mut{color:var(--mut);font-size:15px}
.he{direction:rtl;text-align:right;color:var(--gold);font-size:15px;margin-top:8px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:10px 0}

.btn.sec{background:var(--card2);color:var(--tx)}

.big .e{font-size:34px;width:46px;text-align:center}
.big b{display:block;font-size:19px}
.big span{color:var(--mut);font-size:14px}
.big.hl{background:linear-gradient(135deg,#1f3b5a,#182035);outline:2px solid var(--ac)}

.slot.bad{border-color:var(--bad);background:#ff5c7a33}

.shake{animation:sh .35s}

.c.dim{color:#5b6a93}
.c.bhl{color:var(--gold)}

.opt.bad{background:#7a2a3a}

.sum{text-align:center;font:700 20px var(--mono);margin:6px 0}
.grp{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}

.grp .g.act{outline:2px solid var(--gold)}

.aopts button.long{font:700 14px system-ui,sans-serif}
.aopts button:active{transform:translateY(3px)}
.over{position:absolute;inset:0;background:#000c;display:flex;flex-direction:column;justify-content:center;padding:20px;color:#fff;z-index:3}
.over .card{background:#182035}
.home h1{font-size:24px;margin:6px 0}
.ok-ic{color:var(--ok)}
