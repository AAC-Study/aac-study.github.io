  <!-- экран загрузки: виден сразу, пока грузятся скрипты; сайт сам его убирает -->
  <style>
    .splash { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
    .splash__book { position: relative; width: 132px; height: 88px; perspective: 700px; animation: splash-shift 2.4s cubic-bezier(.45,.05,.3,1) infinite alternate; }
    .splash__half { position: absolute; top: 0; left: 66px; width: 64px; height: 88px; border-radius: 2px 8px 8px 2px; background: var(--surface); border: 1px solid var(--border); border-right: 4px solid var(--accent-2); box-shadow: var(--shadow); }
    .splash__half::before, .splash__back::before { content: ''; position: absolute; inset: 18px 12px; background: repeating-linear-gradient(to bottom, var(--border) 0 2px, transparent 2px 10px); border-radius: 2px; }
    .splash__page { position: absolute; top: 2px; left: 66px; width: 62px; height: 84px; transform-origin: left center; border-radius: 2px 7px 7px 2px;
      background: linear-gradient(90deg, var(--surface-2), var(--surface)); border: 1px solid var(--border);
      animation: splash-flip 2.4s cubic-bezier(.45,.05,.3,1) infinite alternate; }
    .splash__page:nth-child(3) { animation-delay: .15s; }
    .splash__page:nth-child(4) { animation-delay: .3s; }
    .splash__cover { position: absolute; top: -3px; left: 66px; width: 67px; height: 94px; transform-origin: left center; transform-style: preserve-3d;
      animation: splash-cover 2.4s cubic-bezier(.45,.05,.3,1) infinite alternate; }
    .splash__front, .splash__back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .splash__front { border-radius: 3px 10px 10px 3px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: var(--shadow-lg);
      display: flex; align-items: center; justify-content: center; color: #fff; font: 800 34px/1 var(--font); }
    .splash__back { transform: rotateY(180deg); border-radius: 10px 3px 3px 10px; background: var(--surface); border: 1px solid var(--border); box-shadow: inset 0 0 0 0 transparent, var(--shadow); border-right-color: var(--border); border-left: 4px solid var(--accent); }
    @keyframes splash-cover { 0%, 12% { transform: rotateY(0deg); } 60%, 100% { transform: rotateY(-180deg); } }
    @keyframes splash-flip { 0%, 40% { transform: rotateY(0deg); } 88%, 100% { transform: rotateY(-178deg); } }
    @keyframes splash-shift { 0%, 12% { transform: translateX(-33px); } 60%, 100% { transform: translateX(0); } }
    .splash__name { font: 700 20px/1 var(--font); letter-spacing: .3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .splash__slow { min-height: 20px; font-size: 14px; color: var(--text-3); opacity: 0; transition: opacity .6s; text-align: center; padding: 0 16px; }
    .splash.is-slow .splash__slow { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .splash__page, .splash__cover { animation: none; }
      .splash__cover { transform: rotateY(-180deg); }
      .splash__book { animation: splash-pulse 1.6s ease-in-out infinite alternate; }
      @keyframes splash-pulse { from { opacity: .55; } to { opacity: 1; } }
    }
  </style>
